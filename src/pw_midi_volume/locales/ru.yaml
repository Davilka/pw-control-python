  tooltip.action: "Громкость: CC управляет уровнем.\nMute: CC 0–63 включает звук, CC 64–127 выключает.\nMute: нажатие 127\
    \ — одно переключение на нажатие; повторные 127 в пределах ~250 мс считаются одним нажатием.\n   Подходит, если отпускание\
    \ не приходит или приходит 0.\nMute: 127/0 — переключение на каждое сообщение;\n   подходит для кнопок, которые чередуют\
    \ 127 и 0.\nMute: переход 0→127 — только при переходе из 0–63 в 64–127;\n   защищает от повторов 127 при удержании.\n\
    Медиа-действия управляют активным MPRIS-плеером."
